<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>星刃 STELLAR EDGE 3D — 霓虹纵向弹幕射击</title>
<meta name="description" content="星刃 3D 版：Three.js 真实 3D 渲染的霓虹纵向弹幕射击，四种武器模组、强化成长、多阶段 BOSS。">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星刃 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">

<!-- Three.js 直接从仓库里的 vendor/ 取，不依赖任何 CDN -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<style>
  .stage {
    position: relative;
    height: var(--shmup-h);
    width: var(--shmup-w);
  }
  #gl, #hud {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
    border-radius: 14px;
  }
  #gl {
    background: #03040c;
    touch-action: none;
    cursor: crosshair;
    box-shadow:
      0 0 0 1px rgba(120, 215, 255, 0.26),
      0 0 44px rgba(45, 130, 255, 0.26),
      0 22px 60px rgba(0, 0, 0, 0.66);
  }
  #hud { pointer-events: none; }

  .fatal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(3, 6, 16, 0.97);
  }
  .fatal-box {
    max-width: 640px;
    color: var(--ink);
    font-family: var(--font);
  }
  .fatal-box h2 { margin: 0 0 10px; font-size: 18px; }
  .fatal-box p { margin: 8px 0; font-size: 13.5px; line-height: 1.65; color: #9fc0d8; }
  .fatal-box pre {
    margin: 10px 0;
    padding: 10px 12px;
    max-height: 220px;
    overflow: auto;
    font-size: 12px;
    color: #ffb0b0;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .fatal-box a { color: var(--accent); }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 32 32"><path d="M16 2 L21 16 L30 25 L18 21 L16 30 L14 21 L2 25 L11 16 Z" fill="currentColor"/></svg>
    </span>
    <h1 class="brand">星刃 <span>3D EDITION</span></h1>
    <span class="best"><a href="./index.html" style="color:#7fd8ff;text-decoration:none">← 2D 版</a> · 最高分 <b id="bestTop">0</b></span>
  </header>

  <div class="stage" id="stageWrap">
    <canvas id="gl"></canvas>
    <canvas id="hud" width="600" height="900"></canvas>

    <button id="btnBomb" class="bomb" type="button" aria-label="释放炸弹">
      <svg class="bomb-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="11" cy="14" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 7 V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8.6 3.4 h4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M17.6 5.6 l2.4 -2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="bomb-num" id="bombNum">2</span>
    </button>
  </div>

  <div class="rail">
    <div class="rail-left">
      <span class="hint">移动 <kbd>方向键</kbd><kbd>WASD</kbd>拖动 &nbsp;·&nbsp; 炸弹 <kbd>空格</kbd> &nbsp;·&nbsp; 暂停 <kbd>P</kbd></span>
    </div>
    <div class="rail-right">
      <button id="btnPause" class="btn" type="button">暂停</button>
      <button id="btnSound" class="btn" type="button">声音</button>
      <button id="btnFull" class="btn" type="button">全屏</button>
      <button id="btnRestart" class="btn" type="button">重开</button>
    </div>
  </div>

  <p class="foot">
    <span id="fps">--</span>
    <span class="sep">·</span>
    <span id="lastRun">Three.js 真 3D 渲染</span>
  </p>

</div>

<div class="fatal" id="fatal"></div>

<!-- 启动兜底（普通脚本，先于模块执行）：ES 模块这一段无论在哪一环失败
     —— file:// 被跨域拦下、浏览器不支持 importmap、vendor 文件缺失、模块内抛错 ——
     页面都不该只剩一块黑画布，而要给出能照着做的原因。 -->
<script>
(function () {
  var booted = false
  var el = null
  var ESC = { '<': '&lt;', '>': '&gt;', '&': '&amp;' }

  function box() { return el || (el = document.getElementById('fatal')) }

  function show(msg, detail) {
    if (booted) return
    var e = box()
    if (!e) return
    e.style.display = 'flex'
    e.innerHTML = '<div class="fatal-box"><h2>3D 版启动失败</h2><p>' + msg + '</p>' +
      (detail ? '<pre>' + String(detail).replace(/[<>&]/g, function (c) { return ESC[c] }) + '</pre>' : '') +
      '<p class="fatal-hint">2D 版仍然可用：<a href="./index.html">返回 2D 版</a></p></div>'
    document.body.style.overflow = 'auto'
    document.body.style.alignItems = 'flex-start'
  }

  /* 启动成功后调用：撤掉可能已经弹出的兜底提示 */
  function done() {
    booted = true
    var e = box()
    if (e && e.style.display === 'flex') {
      e.style.display = 'none'
      e.innerHTML = ''
      document.body.style.overflow = ''
      document.body.style.alignItems = ''
    }
  }

  window.__stellar3d = { show: show, done: done, isBooted: function () { return booted } }

  var FILE_HINT = '当前是 file:// 直接打开的：浏览器的跨域策略会拦下 ES 模块，3D 版必须经静态服务器访问（线上地址或本地起个静态服务器均可）。'

  window.addEventListener('error', function (e) {
    show(location.protocol === 'file:' ? FILE_HINT : '脚本加载或运行失败。',
      (e && (e.message || (e.target && (e.target.src || e.target.href)))) || '')
  })
  window.addEventListener('unhandledrejection', function (e) {
    show('初始化过程中出现未处理的异常。', (e && e.reason && (e.reason.message || e.reason)) || '')
  })
  window.addEventListener('load', function () {
    setTimeout(function () {
      show(location.protocol === 'file:' ? FILE_HINT
        : '模块没有启动：可能是浏览器不支持 importmap，或 vendor/ 下的 Three.js 文件缺失。')
    }, 4000)
  })
})()
</script>

<script type="module" src="./3d/main.js"></script>
</body>
</html>
