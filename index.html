<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>星刃 STELLAR EDGE — 霓虹纵向弹幕射击</title>
<meta name="description" content="纯 Canvas 实现的霓虹纵版弹幕射击：四种武器模组、强化成长系统、多阶段 BOSS、粒子与泛光特效。零依赖，打开即玩。">
<meta property="og:title" content="星刃 STELLAR EDGE">
<meta property="og:description" content="霓虹纵向弹幕射击 · 四种武器模组 · 强化成长 · 多阶段 BOSS">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L21 16 L30 25 L18 21 L16 30 L14 21 L2 25 L11 16 Z' fill='%2335b6ff'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星刃">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 32 32"><path d="M16 2 L21 16 L30 25 L18 21 L16 30 L14 21 L2 25 L11 16 Z" fill="currentColor"/></svg>
    </span>
    <h1 class="brand">星刃 <span>STELLAR EDGE</span></h1>
    <span class="best"><a href="./3d.html" style="color:#7fd8ff;text-decoration:none">3D 版 →</a> &nbsp;·&nbsp; 最高分 <b id="bestTop">0</b></span>
  </header>

  <div class="stage">
    <canvas id="stage" width="600" height="900" aria-label="游戏画面"></canvas>
    <canvas id="bloom" width="150" height="225" hidden></canvas>

    <!-- 触屏专用浮动炸弹键：常驻在画布底部 HUD 条上，不侵占可拖动区域 -->
    <button id="btnBomb" class="bomb" type="button" aria-label="释放炸弹">
      <svg class="bomb-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="11" cy="14" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 7 V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8.6 3.4 h4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M17.6 5.6 l2.4 -2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="bomb-num" id="bombNum">2</span>
    </button>
  </div>

  <div class="rail">
    <div class="rail-left">
      <span class="hint">移动 <kbd>方向键</kbd><kbd>WASD</kbd>拖动 &nbsp;·&nbsp; 炸弹 <kbd>空格</kbd> &nbsp;·&nbsp; 暂停 <kbd>P</kbd></span>
    </div>
    <div class="rail-right">
      <button id="btnPause" class="btn" type="button">暂停</button>
      <button id="btnSound" class="btn" type="button">声音</button>
      <button id="btnFull" class="btn" type="button">全屏</button>
      <button id="btnRestart" class="btn" type="button">重开</button>
    </div>
  </div>

  <p class="foot">
    <span id="fps">-- FPS</span>
    <span class="sep">·</span>
    <span>四种武器模组 · 强化成长 · 多阶段 BOSS</span>
  </p>

</div>

<script src="game.js"></script>
</body>
</html>
