<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>星刃 STELLAR EDGE — 霓虹纵向弹幕射击</title>
<meta name="description" content="纯 Canvas 实现的霓虹纵版弹幕射击：四种武器模组、强化成长系统、多阶段 BOSS、粒子与泛光特效。零依赖，打开即玩。">
<meta property="og:title" content="星刃 STELLAR EDGE">
<meta property="og:description" content="霓虹纵向弹幕射击 · 四种武器模组 · 强化成长 · 多阶段 BOSS">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L21 16 L30 25 L18 21 L16 30 L14 21 L2 25 L11 16 Z' fill='%2335b6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 32 32"><path d="M16 2 L21 16 L30 25 L18 21 L16 30 L14 21 L2 25 L11 16 Z" fill="currentColor"/></svg>
    </span>
    <h1 class="brand">星刃 <span>STELLAR EDGE</span></h1>
    <span class="best">最高分 <b id="bestTop">0</b></span>
  </header>

  <div class="stage">
    <canvas id="stage" width="600" height="900" aria-label="游戏画面"></canvas>
    <canvas id="bloom" width="150" height="225" hidden></canvas>
  </div>

  <div class="rail">
    <div class="rail-left">
      <span class="hint">移动 <kbd>方向键</kbd><kbd>WASD</kbd>拖动 &nbsp;·&nbsp; 炸弹 <kbd>空格</kbd> &nbsp;·&nbsp; 暂停 <kbd>P</kbd></span>
    </div>
    <div class="rail-right">
      <button id="btnPause" class="btn" type="button">暂停</button>
      <button id="btnSound" class="btn" type="button">声音</button>
      <button id="btnRestart" class="btn" type="button">重开</button>
    </div>
  </div>

  <p class="foot">
    <span id="fps">-- FPS</span>
    <span class="sep">·</span>
    <span>四种武器模组 · 强化成长 · 多阶段 BOSS</span>
  </p>

</div>

<script src="game.js"></script>
</body>
</html>
